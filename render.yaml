schemaVersion: 1
regions:
  - oregon
databases:
  - name: droflove-db
    config:
      plan: free
services:
  - type: web
    name: droflove
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthcheck.php
    autoDeploy: false
    envVars:
      - key: APP_NAME
        value: DrofLove.com
    databases:
      - internalName: droflove-db
        name: droflove-db
        plan: free
